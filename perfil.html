<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookatalog - Perfil</title>

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/perfil.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <header>
        <div class="logo">Bookatalog</div>
        <nav>
            <ul>
                <li><a href="index.html"><img src="assets/img/icons/home_icon.png" alt="Home"><br>Início</a></li>
                <li><a href="catalogo.html"><img src="assets/img/icons/search_icon.png" alt="Buscar"><br>Busca</a></li>
                <li><a href="perfil.html"><img src="assets/img/icons/perfil_icon.png" alt="Perfil"><br>Perfil</a></li>
            </ul>
        </nav>
        <div class="user-avatar"><img src="assets/img/icons/perfil.svg" alt="User"></div>
    </header>

    <main class="profile-container">

        <aside class="profile-card sidebar">
            <h2 class="user-name">Gabriel Francimat</h2>
            <p class="user-handle">@francis</p>

            <div class="avatar-large">
                <img src="assets/img/icons/perfil.svg" alt="Gabriel Avatar">
            </div>

            <button class="btn-upload">Upload to Photo</button>
        </aside>

        <section class="profile-card main-content">
            <div class="form-header">
                <h1>Edit Profile</h1>
                <p class="section-label">User info</p>
            </div>

            <form class="edit-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text">
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text">
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password">
                    </div>
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password">
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email">
                    </div>
                    <div class="form-group">
                        <label>Confirm Email Address</label>
                        <input type="email">
                    </div>
                </div>

                <p class="section-label social-label">Social Profile</p>
                <div class="social-row">
                    <div class="social-input-container">
                        <i class="fa-brands fa-instagram"></i>
                        <input type="text" placeholder="Instagram Username">
                    </div>

                    <div class="social-input-container">
                        <i class="fa-brands fa-x"></i>
                        <input type="text" placeholder="Twitter Username">
                    </div>
                </div>
            </form>
        </section>

    </main>

</body>

</html>
